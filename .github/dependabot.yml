# Security advisories are delivered by Dependabot alerts (enabled in repo
# settings); this file only schedules routine version updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Security updates are a separate stream from version updates and ignore
      # any group that does not opt in, which is why five advisories arrived as
      # five PRs the first time this ran. One patched-advisory PR is easier to
      # review than five, and they nearly always want landing together anyway.
      security:
        applies-to: security-updates
        patterns: ["*"]

      # One PR per class keeps the weekly noise to a couple of reviews
      # rather than a dozen single-package bumps.
      dev-tooling:
        patterns:
          - "@types/*"
          - "@testing-library/*"
          - "@vitejs/*"
          - eslint*
          - vitest
          - jsdom
          - typescript
        update-types: [minor, patch]
      production:
        patterns: ["*"]
        exclude-patterns:
          - "@types/*"
          - "@testing-library/*"
          - "@vitejs/*"
          - eslint*
          - vitest
          - jsdom
          - typescript
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
