# Fast feedback on every push / PR: lint, types, unit tests, production build.
# Optional Playwright against a preview URL: workflow_dispatch only in e2e-preview.yml.
# Playwright with a local dev server: see e2e-local (runs on push to main and on pull requests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests and coverage floor
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  # Playwright against a local dev server, on pushes to main and on pull requests.
  e2e-local:
    name: E2E (local dev server)
    if: success() && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality]
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (local dev server)
        run: npm run test:e2e

      # One-time bootstrap for visual snapshots. Playwright baselines are
      # per-platform; only darwin ones are committed, so visual.spec.ts skips
      # on Linux. This regenerates the Linux set and uploads it — download the
      # artifact, commit web/e2e/visual.spec.ts-snapshots/, and the visual
      # tests start running here automatically. Never fails the build.
      - name: Generate Linux visual baselines (bootstrap artifact)
        if: always()
        continue-on-error: true
        # UPDATE_SNAPSHOTS=1 is required, not decorative: visual.spec.ts skips
        # when the platform has no baseline, and a skipped test writes no
        # snapshot — so the flag alone would produce an empty artifact.
        env:
          UPDATE_SNAPSHOTS: '1'
        run: npm run test:e2e -- visual.spec.ts --update-snapshots || true

      - name: Upload visual baselines
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-snapshots
          path: web/e2e/visual.spec.ts-snapshots/
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
